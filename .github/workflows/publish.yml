name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC trusted publishing (>=11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "❌ Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            echo "   Bump package.json to $TAG_VERSION (or re-tag) before publishing."
            exit 1
          fi
          echo "✅ Tag $GITHUB_REF_NAME matches package.json"

      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## What's Changed"
            echo ""
            echo "See [CHANGELOG.md](https://github.com/Om-jannu/create-fs-app/blob/master/CHANGELOG.md) for details."
            echo ""
            echo "## Installation"
            echo ""
            echo '```bash'
            echo "npx create-fs-app@latest my-app"
            echo '```'
            echo ""
            echo "## Links"
            echo ""
            echo "- [npm package](https://www.npmjs.com/package/create-fs-app)"
            echo "- [Documentation](https://github.com/Om-jannu/create-fs-app#readme)"
          } > release-notes.md
          gh release create "${{ github.ref_name }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes-file release-notes.md

      - name: Summary
        run: |
          echo "## 🎉 Published to npm!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** [create-fs-app](https://www.npmjs.com/package/create-fs-app)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test it:" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "npx create-fs-app@latest my-app" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
