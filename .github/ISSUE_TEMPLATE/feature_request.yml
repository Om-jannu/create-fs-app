name: Feature Request
description: Suggest a new feature or enhancement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        For a new official or contributed **template** (new stack combination), please open
        an issue on the [templates repository](https://github.com/Om-jannu/create-fs-app-templates) instead.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What's missing or frustrating about the current CLI?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like the CLI to do?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've tried.
    validations:
      required: false
